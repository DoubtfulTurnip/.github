name: Docker build and push to GHCR (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: "Build context, relative to repo root"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to repo root"
        required: false
        type: string
        default: "Dockerfile"
      image-suffix:
        description: "Appended to the image name, e.g. '-backend' for multi-image repos"
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated build platforms"
        required: false
        type: string
        default: "linux/amd64"
      free-disk-space:
        description: "Reclaim runner disk space before building (large images, e.g. CUDA/ML base images)"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        if: inputs.free-disk-space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ inputs.image-suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build${{ inputs.image-suffix }}
          cache-to: type=gha,mode=max,scope=build${{ inputs.image-suffix }}
